<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickDASH 廣東話語音評估</title>
    <style>
        :root {
            --green: #26ad60;
            --light-green: #a2d149;
            --yellow: #f1c40f;
            --orange: #e67e22;
            --red: #e74c3c;
            --blue: #3498db;
            --grey: #7f8c8d;
            --dark: #2c3e50;
        }

        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 95%;
            max-width: 600px;
            text-align: center;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 22px;
            font-size: 1.4rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            color: white;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.98); }

        .btn-start { background-color: var(--blue); width: 100%; font-size: 1.8rem; }
        .btn-1 { background-color: var(--green); }
        .btn-2 { background-color: var(--light-green); }
        .btn-3 { background-color: var(--yellow); color: var(--dark); }
        .btn-4 { background-color: var(--orange); }
        .btn-5 { background-color: var(--red); }
        
        .nav-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        .nav-btn {
            background-color: #eee;
            color: #333;
            font-size: 1.1rem;
            padding: 15px;
            flex: 1;
            border-radius: 12px;
        }

        .back-btn {
            background-color: var(--grey);
            color: white;
        }

        #progress-bar {
            width: 100%;
            height: 12px;
            background: #e0e0e0;
            border-radius: 6px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: var(--blue);
            width: 0%;
            transition: width 0.3s;
        }

        .result-box {
            border: 4px solid var(--blue);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            background-color: #f8fbff;
        }

        .hidden { display: none !important; }
        p { font-size: 1.5rem; line-height: 1.4; margin: 20px 0; font-weight: bold; color: var(--dark); }
        .instruction { font-size: 1.3rem; color: #d35400; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="progress-bar" class="hidden"><div id="progress-fill"></div></div>
    
    <div id="start-screen">
        <h1 style="color: var(--dark); margin-bottom: 15px;">上肢功能評估 (QuickDASH)</h1>
        <h2 style="color: var(--grey); font-size: 1.3rem; margin-top: -10px; margin-bottom: 35px; font-weight: bold;">
            新界東醫院聯網 物理治療部
        </h2>
        <p>請撳下面藍色掣開始</p>
        <button class="btn-start" onclick="startAssessment()">開始做問卷</button>
    </div>

    <div id="question-screen" class="hidden">
        <h2 id="question-number" style="color: var(--blue);">第 1 題</h2>
        <p id="question-text"></p>
        
        <div class="btn-grid">
            <button class="btn-1" onclick="handleAnswer(1)" id="opt1"></button>
            <button class="btn-2" onclick="handleAnswer(2)" id="opt2"></button>
            <button class="btn-3" onclick="handleAnswer(3)" id="opt3"></button>
            <button class="btn-4" onclick="handleAnswer(4)" id="opt4"></button>
            <button class="btn-5" onclick="handleAnswer(5)" id="opt5"></button>
        </div>

        <div class="nav-container">
            <button id="back-btn" class="nav-btn back-btn hidden" onclick="goBack()">⬅ 返回上一條</button>
            <button class="nav-btn" onclick="speakCurrent(true)">🔊 重複多次題目</button>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <h1 style="color: var(--green);">搞掂晒！做完喇！</h1>
        <div class="result-box">
            <span style="font-size: 1.2rem;">你嘅 QuickDASH 分數係：</span>
            <div id="final-score" style="font-size: 5rem; font-weight: 900; color: var(--blue);">--</div>
        </div>
        <p class="instruction">記住寫低呢個分數，<br>陣間話畀物理治療師聽呀。</p>
        <button class="btn-start" onclick="location.reload()" style="margin-top: 20px;">重新開始</button>
    </div>
</div>

<script>
    const questionsData = [
        { display: "扭開緊或者新嘅樽蓋", speak: "扭開好實、或者新嘅樽蓋" },
        { display: "做消耗大量體力的家務，例如抹窗或者洗擦地板", speak: "做要用好多體力嘅家務，例如抹窗或者洗地" },
        { display: "提重物或者手提包", speak: "拎重嘢或者手袋" },
        { display: "洗背部", speak: "沖涼洗背脊" },
        { display: "用刀切食物", speak: "用刀切嘢食" },
        { display: "進行一些需要上肢用力或受震盪的康樂活動", speak: "做一啲手部要用力、或者會受震盪嘅康樂活動" },
        { display: "在過去一星期內，你的上肢問題在多大程度上干擾了你正常的社交活動？", speak: "過去一星期，你手部嘅問題有幾影響你平時嘅社交活動？" },
        { display: "在過去一星期內，你的工作或其他日常活動是否因上肢問題而受到限制？", speak: "過去一星期，你返工或者其他日常活動，有冇因為手部問題而受到限制？" },
        { display: "上肢痛楚（包括肩膀、手臂或手部）", speak: "手部痛楚，包括膊頭、手臂或者手掌" },
        { display: "上肢有麻痺或刺痛的感覺", speak: "手部有麻痺或者刺痛嘅感覺" },
        { display: "在過去一星期內，你是否因為上肢痛楚而感到入睡困難？", speak: "過去一星期，你有冇因為手痛而覺得好難入睡？" }
    ];

    let currentStep = 0;
    let scores = [];
    let repeatTimeout; 
    let currentUtterance; 

    // 全面固定使用 0.75 慢速語速 (Locked strictly to 0.75 for clear, steady narration)
    function getAdjustedRate() {
        return 0.75; 
    }

    function speak(text, callback, isQuestion = false) {
        window.speechSynthesis.cancel(); 
        clearTimeout(repeatTimeout); 

        currentUtterance = new SpeechSynthesisUtterance(text);
        currentUtterance.lang = 'zh-HK';
        currentUtterance.rate = getAdjustedRate(); 
        
        const voices = window.speechSynthesis.getVoices();
        const hkVoices = voices.filter(v => v.lang === 'zh-HK' || v.lang === 'zh_HK');
        if (hkVoices.length > 0) {
            currentUtterance.voice = hkVoices.find(v => v.name.includes('Premium') || v.name.includes('Google')) || hkVoices[0];
        }
        
        currentUtterance.onend = () => {
            if (callback) callback();
            
            if (isQuestion) {
                repeatTimeout = setTimeout(() => {
                    speakCurrent(true);
                }, 20000); 
            }
        };
        
        window.speechSynthesis.speak(currentUtterance);
    }

    function startAssessment() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('question-screen').classList.remove('hidden');
        document.getElementById('progress-bar').classList.remove('hidden');
        loadQuestion();
    }

    function getLabels() {
        if (currentStep >= 8) {
            return {
                display: ["沒有", "輕微", "中度", "嚴重", "極度"],
                speak: ["完全冇", "輕微", "中度", "嚴重", "極度嚴重"]
            };
        }
        if (currentStep === 6) {
            return {
                display: ["完全沒有", "少許", "中度", "頗大程度", "極大程度"],
                speak: ["完全冇", "有少少", "中等", "幾大程度", "極大程度"]
            };
        }
        return {
            display: ["沒有困難", "少許困難", "中度困難", "非常困難", "不能做到"],
            speak: ["完全冇困難", "有少少困難", "中度困難", "非常困難", "完全做唔到"]
        };
    }

    function loadQuestion() {
        const q = questionsData[currentStep];
        document.getElementById('question-number').innerText = `第 ${currentStep + 1} 題`;
        
        document.getElementById('question-text').innerText = q.display;
        document.getElementById('progress-fill').style.width = `${((currentStep + 1) / 11) * 100}%`;
        
        const backBtn = document.getElementById('back-btn');
        if (currentStep > 0) backBtn.classList.remove('hidden');
        else backBtn.classList.add('hidden');

        const labels = getLabels();
        for(let i=1; i<=5; i++) {
            document.getElementById(`opt${i}`).innerText = `${i}. ${labels.display[i-1]}`;
        }
        
        speakCurrent();
    }

    function speakCurrent(isReplay = false) {
        const qSpeak = questionsData[currentStep].speak;
        const labelsSpeak = getLabels().speak;
        
        let intro = isReplay ? "等我重複多次條題目。" : `第${currentStep + 1}題。`;
        let speech = `${intro}${qSpeak}。請選擇：一，${labelsSpeak[0]}；二，${labelsSpeak[1]}；三，${labelsSpeak[2]}；四，${labelsSpeak[3]}；五，${labelsSpeak[4]}。`;
        
        speak(speech, null, true);
    }

    function handleAnswer(points) {
        clearTimeout(repeatTimeout);
        window.speechSynthesis.cancel();

        const labelsSpeak = getLabels().speak;
        const selectedText = labelsSpeak[points - 1];
        
        const buttons = document.querySelectorAll('button');
        buttons.forEach(b => b.style.pointerEvents = 'none');

        speak(`你揀咗：${selectedText}。`, () => {
            scores.push(points);
            currentStep++;
            buttons.forEach(b => b.style.pointerEvents = 'auto');
            
            if (currentStep < questionsData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }, false); 
    }

    function goBack() {
        clearTimeout(repeatTimeout);
        window.speechSynthesis.cancel();

        if (currentStep > 0) {
            scores.pop(); 
            currentStep--; 
            speak("返回上一條題目。", () => {
                loadQuestion();
            }, false);
        }
    }

    function showResults() {
        clearTimeout(repeatTimeout);
        window.speechSynthesis.cancel();

        const sum = scores.reduce((a, b) => a + b, 0);
        const finalScore = ((sum / 11) - 1) * 25;
        document.getElementById('question-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = finalScore.toFixed(1);
        
        speak(`做完晒喇！你嘅分數係 ${finalScore.toFixed(1)} 分。記住要寫低呢個分數，陣間話畀你嘅物理治療師聽呀。`, null, false);
    }

    window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
    };
</script>
</body>
</html>
