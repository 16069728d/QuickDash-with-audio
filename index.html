<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickDASH 廣東話評估</title>
    <style>
        :root {
            --green: #26ad60;
            --light-green: #a2d149;
            --yellow: #f1c40f;
            --orange: #e67e22;
            --red: #e74c3c;
            --blue: #3498db;
            --dark: #2c3e50;
        }

        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 95%;
            max-width: 600px;
            text-align: center;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 25px;
            font-size: 1.4rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }

        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-start { background-color: var(--blue); width: 100%; font-size: 1.8rem; }
        .btn-1 { background-color: var(--green); }
        .btn-2 { background-color: var(--light-green); }
        .btn-3 { background-color: var(--yellow); color: var(--dark); }
        .btn-4 { background-color: var(--orange); }
        .btn-5 { background-color: var(--red); }
        
        #progress-bar {
            width: 100%;
            height: 12px;
            background: #e0e0e0;
            border-radius: 6px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: var(--blue);
            width: 0%;
            transition: width 0.3s;
        }

        .result-box {
            border: 4px solid var(--blue);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            background-color: #f8fbff;
        }

        .hidden { display: none; }
        p { font-size: 1.5rem; line-height: 1.4; margin: 20px 0; font-weight: bold; color: var(--dark); }
        .instruction { font-size: 1.1rem; color: #e67e22; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="progress-bar" class="hidden"><div id="progress-fill"></div></div>
    
    <div id="start-screen">
        <h1 style="color: var(--dark);">上肢功能問卷 (QuickDASH)</h1>
        <p>請點擊下方藍色按鈕開始</p>
        <button class="btn-start" onclick="startAssessment()">開始 (START)</button>
    </div>

    <div id="question-screen" class="hidden">
        <h2 id="question-number" style="color: var(--blue);">第 1 題</h2>
        <p id="question-text"></p>
        
        <div class="btn-grid" id="options-grid">
            <button class="btn-1" onclick="handleAnswer(1)" id="opt1"></button>
            <button class="btn-2" onclick="handleAnswer(2)" id="opt2"></button>
            <button class="btn-3" onclick="handleAnswer(3)" id="opt3"></button>
            <button class="btn-4" onclick="handleAnswer(4)" id="opt4"></button>
            <button class="btn-5" onclick="handleAnswer(5)" id="opt5"></button>
        </div>
        <button id="replay-btn" style="background:#eee; color:#333; margin-top:20px; font-size:1rem; padding: 10px 20px;" onclick="speakCurrent()">🔊 重讀問題 (Replay)</button>
    </div>

    <div id="result-screen" class="hidden">
        <h1 style="color: var(--green);">評估完成</h1>
        <div class="result-box">
            <span style="font-size: 1.2rem; color: var(--dark);">您的 QuickDASH 分數是：</span>
            <div id="final-score" style="font-size: 5rem; font-weight: 900; color: var(--blue);">--</div>
        </div>
        <p class="instruction">請記下此分數，並交給您的物理治療師。</p>
        <button class="btn-start" onclick="location.reload()" style="margin-top: 10px;">重新開始</button>
    </div>
</div>

<script>
    const questions = [
        "扭開緊或新的瓶蓋",
        "做消耗大量體力的家務，例如抹窗或洗擦地板",
        "提重物或手提包",
        "洗背部",
        "用刀切食物",
        "進行一些需要上肢用力或受震盪的康樂活動",
        "在過去一星期內，你的上肢問題在多大程度上干擾了你正常的社交活動？",
        "在過去一星期內，你的工作或其他日常活動是否因上肢問題而受到限制？",
        "上肢痛楚（包括肩膀、手臂或手部）",
        "上肢有麻痺或刺痛的感覺",
        "在過去一星期內，你是否因為上肢痛楚而感到入睡困難？"
    ];

    let currentStep = 0;
    let scores = [];

    function speak(text, callback) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-HK';
        msg.rate = 0.85;
        if (callback) {
            msg.onend = callback;
        }
        window.speechSynthesis.speak(msg);
    }

    function startAssessment() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('question-screen').classList.remove('hidden');
        document.getElementById('progress-bar').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        const q = questions[currentStep];
        document.getElementById('question-number').innerText = `第 ${currentStep + 1} 題 (共 11 題)`;
        document.getElementById('question-text').innerText = q;
        document.getElementById('progress-fill').style.width = `${((currentStep + 1) / 11) * 100}%`;
        
        let labels = [];
        if (currentStep >= 8) {
            labels = ["沒有", "輕微", "中度", "嚴重", "極度"];
        } else if (currentStep === 6) {
            labels = ["完全沒有", "少許", "中度", "頗大程度", "極大程度"];
        } else {
            labels = ["沒有困難", "少許困難", "中度困難", "非常困難", "不能做到"];
        }

        for(let i=1; i<=5; i++) {
            const btn = document.getElementById(`opt${i}`);
            btn.innerText = `${i}. ${labels[i-1]}`;
            btn.disabled = false;
        }
        document.getElementById('replay-btn').disabled = false;

        speakCurrent();
    }

    function speakCurrent() {
        const q = questions[currentStep];
        const b1 = document.getElementById('opt1').innerText.split('. ')[1];
        const b2 = document.getElementById('opt2').innerText.split('. ')[1];
        const b3 = document.getElementById('opt3').innerText.split('. ')[1];
        const b4 = document.getElementById('opt4').innerText.split('. ')[1];
        const b5 = document.getElementById('opt5').innerText.split('. ')[1];
        
        let speechText = `第${currentStep + 1}題。${q}。請選擇：一，${b1}。二，${b2}。三，${b3}。四，${b4}。五，${b5}。`;
        speak(speechText);
    }

    function handleAnswer(points) {
        // Disable buttons to prevent double-tapping during confirmation
        for(let i=1; i<=5; i++) { document.getElementById(`opt${i}`).disabled = true; }
        document.getElementById('replay-btn').disabled = true;

        const selectedText = document.getElementById(`opt${points}`).innerText.split('. ')[1];
        scores.push(points);
        
        // Confirmation Audio
        speak(`你選擇咗：${selectedText}。`, () => {
            // Wait a brief moment after speaking before loading next
            setTimeout(() => {
                currentStep++;
                if (currentStep < questions.length) {
                    loadQuestion();
                } else {
                    finishAssessment();
                }
            }, 500);
        });
    }

    function finishAssessment() {
        const sum = scores.reduce((a, b) => a + b, 0);
        const finalCalculatedScore = ((sum / 11) - 1) * 25;
        
        document.getElementById('question-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = finalCalculatedScore.toFixed(1);
        
        let finishSpeech = `評估完成。你的分數是 ${finalCalculatedScore.toFixed(1)} 分。請記下這個分數，並交給你的物理治療師。`;
        speak(finishSpeech);
    }
</script>
</body>
</html>
