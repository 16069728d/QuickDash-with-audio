<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickDASH 廣東話語音評估 (配圖版)</title>
    <style>
        :root {
            --green: #26ad60;
            --light-green: #a2d149;
            --yellow: #f1c40f;
            --orange: #e67e22;
            --red: #e74c3c;
            --blue: #3498db;
            --grey: #7f8c8d;
            --dark: #2c3e50;
        }

        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 95%;
            max-width: 600px;
            text-align: center;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        /* Base button styles */
        .opt-btn {
            padding: 15px 22px;
            font-size: 1.4rem;
            font-weight: bold;
            border: 3px solid transparent;
            border-radius: 15px;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s, box-shadow 0.3s;
        }

        .opt-btn span.emoji {
            font-size: 2rem;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .opt-btn:active { transform: scale(0.98); }

        /* Dynamic Visual Cues */
        .btn-dimmed {
            opacity: 0.4;
            transform: scale(0.95);
        }

        .btn-highlight {
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border: 3px solid #2c3e50;
            z-index: 10;
        }

        .btn-start { background-color: var(--blue); width: 100%; font-size: 1.8rem; padding: 22px; border: none; border-radius: 15px; color: white; cursor: pointer; font-weight: bold;}
        .btn-1 { background-color: var(--green); }
        .btn-2 { background-color: var(--light-green); color: var(--dark); }
        .btn-3 { background-color: var(--yellow); color: var(--dark); }
        .btn-4 { background-color: var(--orange); }
        .btn-5 { background-color: var(--red); }
        
        .nav-container {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-btn {
            background-color: #eee;
            color: #333;
            font-size: 1.1rem;
            padding: 15px;
            flex: 1;
            min-width: 120px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .back-btn { background-color: var(--grey); color: white; }
        .explain-btn { background-color: #ffeaa7; color: #d35400; }

        #progress-bar {
            width: 100%;
            height: 12px;
            background: #e0e0e0;
            border-radius: 6px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: var(--blue);
            width: 0%;
            transition: width 0.3s;
        }

        .result-box {
            border: 4px solid var(--blue);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            background-color: #f8fbff;
        }

        /* Question Visual Area */
        #question-visual {
            font-size: 3.5rem;
            background: #f8fbff;
            border: 3px dashed #bdc3c7;
            border-radius: 20px;
            padding: 10px 15px;
            margin: 10px 0;
            display: inline-block;
            min-width: 150px;
            letter-spacing: 5px;
        }

        /* Instructions Box Style */
        .instructions-box {
            text-align: left;
            background-color: #e8f4f8;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            color: var(--dark);
            font-size: 1rem;
            line-height: 1.5;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .instructions-box ul {
            padding-left: 20px;
            margin-top: 10px;
            margin-bottom: 0;
        }
        .instructions-box li {
            margin-bottom: 8px;
        }

        .hidden { display: none !important; }
        p { font-size: 1.4rem; line-height: 1.4; margin: 15px 0; font-weight: bold; color: var(--dark); }
        .instruction { font-size: 1.3rem; color: #d35400; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="progress-bar" class="hidden"><div id="progress-fill"></div></div>
    
    <div id="start-screen">
        <h1 style="color: var(--dark); margin-bottom: 15px;">上肢功能評估 (QuickDASH)</h1>
        <h2 style="color: var(--grey); font-size: 1.3rem; margin-top: -10px; margin-bottom: 15px; font-weight: bold;">
            新界東醫院聯網 物理治療部
        </h2>

        <div class="instructions-box">
            <strong>說明：</strong>
            <ul>
                <li>這份問卷主要詢問您的症狀，以及您完成特定活動的能力。</li>
                <li>請根據您過去一星期的狀況回答每項問題，並圈選適當的數字。</li>
                <li>如果過去一星期您沒有機會從事某項活動，請盡可能估測最正確的答案。</li>
                <li>請依照您的能力回答，至於您是用哪一隻手或手臂、或是以何種方式完成動作皆可。</li>
            </ul>
        </div>

        <div style="font-size: 5rem; margin-bottom: 20px;">📋💪</div>
        <p>請撳下面藍色掣開始</p>
        <button class="btn-start" onclick="startAssessment()">開始做問卷</button>
    </div>

    <div id="question-screen" class="hidden">
        <h2 id="question-number" style="color: var(--blue); margin-bottom: 5px;">第 1 題</h2>
        
        <div id="question-visual">🫙</div>
        
        <p id="question-text"></p>
        
        <div class="btn-grid">
            <button class="opt-btn btn-1" onclick="handleAnswer(1)" id="opt1"></button>
            <button class="opt-btn btn-2" onclick="handleAnswer(2)" id="opt2"></button>
            <button class="opt-btn btn-3" onclick="handleAnswer(3)" id="opt3"></button>
            <button class="opt-btn btn-4" onclick="handleAnswer(4)" id="opt4"></button>
            <button class="opt-btn btn-5" onclick="handleAnswer(5)" id="opt5"></button>
        </div>

        <div class="nav-container">
            <button id="back-btn" class="nav-btn back-btn hidden" onclick="goBack()">⬅ 返回</button>
            <button class="nav-btn explain-btn" onclick="speakExplanation()">💡 聽解釋</button>
            <button class="nav-btn" onclick="speakCurrent(true)">🔊 重複</button>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <h1 style="color: var(--green);">搞掂晒！做完喇！</h1>
        <div style="font-size: 4rem; margin: 10px 0;">🎉👏</div>
        <div class="result-box">
            <span style="font-size: 1.2rem;">你嘅 QuickDASH 分數係：</span>
            <div id="final-score" style="font-size: 5rem; font-weight: 900; color: var(--blue);">--</div>
        </div>
        <p class="instruction">記住寫低呢個分數，<br>陣間話畀物理治療師聽呀。</p>
        <button class="btn-start" onclick="location.reload()" style="margin-top: 20px;">重新開始</button>
    </div>
</div>

<script>
    const questionsData = [
        { text: "扭開緊或者新的樽蓋", explanation: "即係扭開好實、或者新買返嚟未開過嘅樽蓋", visual: "🫙💪" },
        { text: "做消耗大量體力的家務，例如抹窗或者洗擦地板", explanation: "即係做一啲要用好多氣力嘅家務，例如抹窗或者拖地", visual: "🧹🪣" },
        { text: "提重物或者手提包", explanation: "即係拎重嘢，或者抽住個手袋", visual: "🛍️🏋️" },
        { text: "洗背部", explanation: "即係沖涼嗰陣時洗背脊", visual: "🚿🧽" },
        { text: "用刀切食物", explanation: "即係煮飯食飯嗰陣，用刀切嘢食", visual: "🔪🥩" },
        { text: "進行一些需要上肢用力或受震盪的康樂活動", explanation: "即係做一啲手部要用力、或者會受震盪嘅運動，例如打波、游水", visual: "🏸🎾" },
        { text: "在過去一星期內，你手臂、肩膀或手部的問題,的上肢問題在多大程度上干擾了你正常的社交活動？", explanation: "過去一個星期，你手部嘅問題有幾大程度影響到你平時見家人、朋友、或者其他人嘅社交活動？", visual: "👨‍👩‍👧‍👦🧑‍🤝‍🧑" },
        { text: "在過去一星期內，是否因手臂、肩膀或手部的問題,而在工作或其他日常活動受到限制？", explanation: "過去一個星期，你返工或者做其他日常活動嗰陣，有冇因為手部嘅問題而覺得做唔到？", visual: "💼🪥" },
        { text: "在過去一星期內，上肢感覺痛楚的嚴重程度（包括手臂、肩膀或手部）", explanation: "即係成隻手痛，包括膊頭、手臂或者手掌痛", visual: "😫 💪 🤜 🖐️ 💥" },
        { text: "在過去一星期內，上肢感覺刺痛的嚴重程度（包括手臂、肩膀或手部）", explanation: "即係隻手有痺嘅感覺，或者好似有針拮嘅痛楚", visual: "⚡💪" },
        { text: "在過去一星期內，因為上肢痛楚，你有多難入睡？", explanation: "過去一個星期，你有冇因為手痛，搞到好難瞓得著，有幾影響你？", visual: "🛌😫" }
    ];

    let currentStep = 0;
    let scores = [];
    let repeatTimeout; 
    let sequenceId = 0; 

    function getAdjustedRate() {
        return 0.75; 
    }

    function getOptionsData() {
        if (currentStep >= 8) {
            return [
                { text: "沒有", icon: "😄" },
                { text: "輕微", icon: "🙂" },
                { text: "中度", icon: "😐" },
                { text: "嚴重", icon: "😫" },
                { text: "極度", icon: "😭" }
            ];
        }
        if (currentStep === 6) {
            return [
                { text: "完全沒有", icon: "😄" },
                { text: "少許", icon: "🙂" },
                { text: "中度", icon: "😐" },
                { text: "頗大程度", icon: "😫" },
                { text: "極大程度", icon: "😭" }
            ];
        }
        return [
            { text: "沒有困難", icon: "😄" },
            { text: "少許困難", icon: "🙂" },
            { text: "中度困難", icon: "😐" },
            { text: "非常困難", icon: "😫" },
            { text: "不能做到", icon: "❌" }
        ];
    }

    function startAssessment() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('question-screen').classList.remove('hidden');
        document.getElementById('progress-bar').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        const q = questionsData[currentStep];
        document.getElementById('question-number').innerText = `第 ${currentStep + 1} / 11 題`;
        document.getElementById('question-text').innerText = q.text;
        document.getElementById('question-visual').innerText = q.visual; 
        document.getElementById('progress-fill').style.width = `${((currentStep + 1) / 11) * 100}%`;
        
        const backBtn = document.getElementById('back-btn');
        if (currentStep > 0) backBtn.classList.remove('hidden');
        else backBtn.classList.add('hidden');

        const options = getOptionsData();
        for(let i=1; i<=5; i++) {
            document.getElementById(`opt${i}`).innerHTML = `<span class="emoji">${options[i-1].icon}</span> <span>${i}. ${options[i-1].text}</span>`;
        }
        
        speakCurrent();
    }

    function stopSpeaking() {
        sequenceId++; 
        window.speechSynthesis.cancel();
        clearTimeout(repeatTimeout);
        resetButtonStyles();
    }

    function resetButtonStyles() {
        for(let i=1; i<=5; i++) {
            let btn = document.getElementById(`opt${i}`);
            btn.classList.remove('btn-dimmed', 'btn-highlight');
        }
    }

    function speakPromise(text, seq) {
        return new Promise(resolve => {
            if (seq !== sequenceId) return resolve(); 
            
            window.currentUtterance = new SpeechSynthesisUtterance(text);
            window.currentUtterance.lang = 'zh-HK';
            window.currentUtterance.rate = getAdjustedRate();
            
            const voices = window.speechSynthesis.getVoices();
            const hkVoices = voices.filter(v => v.lang === 'zh-HK' || v.lang === 'zh_HK');
            if (hkVoices.length > 0) {
                window.currentUtterance.voice = hkVoices.find(v => v.name.includes('Premium') || v.name.includes('Google')) || hkVoices[0];
            }
            
            window.currentUtterance.onend = resolve;
            window.currentUtterance.onerror = resolve; 
            
            window.speechSynthesis.speak(window.currentUtterance);
        });
    }

    async function speakCurrent(isReplay = false) {
        stopSpeaking();
        const currentSeq = sequenceId;
        const q = questionsData[currentStep];
        const options = getOptionsData();
        
        // 此行確保如果按下重複按鈕(isReplay = true)，intro為空字串，直接讀出題目
        let intro = isReplay ? "" : `第 ${currentStep + 1} 題。`;
        
        await speakPromise(`${intro}${q.text}。請選擇：`, currentSeq);
        if (currentSeq !== sequenceId) return; 

        for(let i=1; i<=5; i++) {
            if (currentSeq !== sequenceId) return;

            for(let j=1; j<=5; j++) {
                let btn = document.getElementById(`opt${j}`);
                if(j === i) {
                    btn.classList.add('btn-highlight');
                    btn.classList.remove('btn-dimmed');
                } else {
                    btn.classList.add('btn-dimmed');
                    btn.classList.remove('btn-highlight');
                }
            }

            await speakPromise(`第 ${i}，${options[i-1].text}`, currentSeq);
        }

        if (currentSeq !== sequenceId) return;
        
        resetButtonStyles();

        repeatTimeout = setTimeout(() => {
            speakCurrent(true);
        }, 15000); 
    }

    async function speakExplanation() {
        stopSpeaking();
        const currentSeq = sequenceId;
        const q = questionsData[currentStep];
        
        await speakPromise(`${q.explanation}。`, currentSeq);
        
        if (currentSeq === sequenceId) {
            speakCurrent(false); 
        }
    }

    function handleAnswer(points) {
        stopSpeaking(); 
        
        const buttons = document.querySelectorAll('.opt-btn');
        buttons.forEach(b => b.style.pointerEvents = 'none'); 

        const selectedOption = getOptionsData()[points - 1];
        speakPromise(`你揀咗：${selectedOption.text}。`, sequenceId).then(() => {
            scores.push(points);
            currentStep++;
            buttons.forEach(b => b.style.pointerEvents = 'auto');
            
            if (currentStep < questionsData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        });
    }

    function goBack() {
        stopSpeaking();

        if (currentStep > 0) {
            scores.pop(); 
            currentStep--; 
            speakPromise("返回上一條題目。", sequenceId).then(() => {
                loadQuestion();
            });
        }
    }

    function showResults() {
        stopSpeaking();

        const sum = scores.reduce((a, b) => a + b, 0);
        const finalScore = Math.round(((sum / 11) - 1) * 25); 
        
        document.getElementById('question-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = finalScore;
        
        speakPromise(`做完晒喇！你嘅分數係 ${finalScore} 分。記住要寫低呢個分數，陣間話畀你嘅物理治療師聽呀。`, sequenceId);
    }

    window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
    };
</script>
</body>
</html>
